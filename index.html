<style>
/* Layout: arched portrait hero, a navy "range" band, then alternating paper and colour-block sections that read like work moving between teams. */
:root{
  --paper:#FBF5E1; --paper-2:#F3E8C3; --ink:#1D2340; --ink-soft:#4B5068; --line:rgba(29,35,64,.16);
  --accent:#5A2848; --accent-2:#56622F; --butter:#F1D27A; --navy:#1D2340; --navy-fg:#F6E7B0;
  --p1:#5A2848; --p1-fg:#FBEFD8; --p2:#4F5B2A; --p2-fg:#FBF4DC; --p3:#F1D27A; --p3-fg:#2B2236;
  --p4:#1D2340; --p4-fg:#F6E7B0; --p5:#2C4733; --p5-fg:#F3EBD0;
  --btn:#5A2848; --btn-fg:#FBF5E1; --focus:#56622F;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --wrap:1120px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13162B; --paper-2:#1B1F3A; --ink:#F2EAD3; --ink-soft:#BDB7A6; --line:rgba(242,234,211,.15);
  --accent:#DDA9C8; --accent-2:#B6C47E; --navy:#0C0F20; --navy-fg:#F1D27A;
  --p1:#4A2140; --p1-fg:#FBEFD8; --p2:#414B22; --p2-fg:#FBF4DC; --p3:#E6C66C; --p3-fg:#2B2236;
  --p4:#232A50; --p4-fg:#F6E7B0; --p5:#24402C; --p5-fg:#F3EBD0;
  --btn:#F1D27A; --btn-fg:#1D2340; --focus:#F1D27A; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#13162B; --paper-2:#1B1F3A; --ink:#F2EAD3; --ink-soft:#BDB7A6; --line:rgba(242,234,211,.15);
  --accent:#DDA9C8; --accent-2:#B6C47E; --navy:#0C0F20; --navy-fg:#F1D27A;
  --p1:#4A2140; --p1-fg:#FBEFD8; --p2:#414B22; --p2-fg:#FBF4DC; --p3:#E6C66C; --p3-fg:#2B2236;
  --p4:#232A50; --p4-fg:#F6E7B0; --p5:#24402C; --p5-fg:#F3EBD0;
  --btn:#F1D27A; --btn-fg:#1D2340; --focus:#F1D27A; color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
.label{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
section{padding-block:clamp(56px,9vw,104px)}
.sec-head{display:grid;gap:14px;max-width:62ch;margin-bottom:clamp(32px,5vw,52px)}
.sec-head h2{font-size:clamp(2rem,4.4vw,3.1rem)}
.sec-head p{color:var(--ink-soft);font-size:1.08rem}
.sec-head .label{color:var(--accent)}

/* Hero */
.hero{padding-block:clamp(36px,6vw,72px) clamp(40px,6vw,80px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,72px);align-items:center}
.portrait{position:relative;max-width:440px;width:100%;justify-self:center}
.portrait::before{content:"";position:absolute;inset:7% -6% -4% 8%;background:var(--butter);border-radius:999px 999px 18px 18px;z-index:0}
.portrait .arch{position:relative;z-index:1;border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--p1);aspect-ratio:4/5;max-width:100%}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.stamp{position:absolute;z-index:2;left:-4%;bottom:8%;background:var(--p5);color:var(--p5-fg);padding:10px 14px;border-radius:12px;display:grid;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.stamp b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.hero-copy{display:grid;gap:22px;min-width:0}
.hero-copy .label{color:var(--accent-2)}
.name{font-size:clamp(3.2rem,8.6vw,6.6rem);letter-spacing:-.015em}
.role{font-family:var(--f-display);font-size:clamp(1.5rem,3vw,2.2rem);color:var(--accent);line-height:1.1}
.intro{font-size:1.12rem;max-width:56ch;color:var(--ink-soft)}
.contact{display:grid;gap:0;border-top:1px solid var(--line);max-width:560px}
.c-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.c-row .label{color:var(--ink-soft)}
.c-val{overflow-wrap:anywhere;font-weight:500;user-select:text}
.copy{font:inherit;font-size:.8rem;font-family:var(--f-mono);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.copy:hover{border-color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 .98rem var(--f-body);padding:12px 20px;border-radius:999px;border:2px solid var(--btn);background:var(--btn);color:var(--btn-fg);text-decoration:none;cursor:pointer;transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}

/* Range band */
.band{background:var(--navy);color:var(--navy-fg)}
.band .wrap{padding-block:22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 0}
.band-label{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-right:20px}
.band ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 0}
.band li{font-family:var(--f-display);font-size:clamp(1.05rem,2vw,1.3rem)}
.band li:not(:last-child)::after{content:"/";margin:0 14px;opacity:.45}

/* Profile */
.profile-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,64px);align-items:start}
.profile-text{font-family:var(--f-display);font-size:clamp(1.3rem,2.4vw,1.75rem);line-height:1.35}
.facts{display:grid;gap:0;border-top:2px solid var(--ink)}
.fact{display:grid;gap:4px;padding-block:14px;border-bottom:1px solid var(--line)}
.fact .label{color:var(--accent-2)}

/* Flow */
.flow-sec{background:var(--paper-2)}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative}
.flow::before{content:"";position:absolute;left:0;right:0;top:27px;height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 14px);opacity:.35}
.stage{position:relative;display:grid;gap:10px;padding-right:18px;align-content:start}
.dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;position:relative}
.stage:nth-child(1) .dot{background:var(--p1);color:var(--p1-fg)}
.stage:nth-child(2) .dot{background:var(--p2);color:var(--p2-fg)}
.stage:nth-child(3) .dot{background:var(--p3);color:var(--p3-fg)}
.stage:nth-child(4) .dot{background:var(--p4);color:var(--p4-fg)}
.stage:nth-child(5) .dot{background:var(--p5);color:var(--p5-fg)}
.stage h3{font-size:1.45rem;margin-top:6px}
.stage .with{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.stage p{color:var(--ink-soft);font-size:.98rem}
.me-note{margin-top:36px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--ink-soft);font-size:.98rem}
.me-note b{color:var(--ink)}

/* Roles */
.roles{display:grid;gap:14px}
.role-block{border-radius:20px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,56px)}
.role-block:nth-child(1){background:var(--p1);color:var(--p1-fg)}
.role-block:nth-child(2){background:var(--p2);color:var(--p2-fg)}
.role-block:nth-child(3){background:var(--p3);color:var(--p3-fg)}
.role-block:nth-child(4){background:var(--p4);color:var(--p4-fg)}
.role-block:nth-child(5){background:var(--p5);color:var(--p5-fg)}
.role-head{display:grid;gap:14px;align-content:start}
.role-head h3{font-size:clamp(1.7rem,3.2vw,2.4rem)}
.role-head .lede{font-size:1.08rem;opacity:.92}
.role-head .label{opacity:.75}
.role-head .wwith{font-size:.95rem;opacity:.85}
.role-points{list-style:none;margin:0;padding:0;display:grid;gap:0}
.role-points li{padding:12px 0 12px 30px;border-top:1px solid currentColor;border-color:color-mix(in srgb, currentColor 22%, transparent);position:relative}
.role-points li:first-child{border-top:none;padding-top:0}
.role-points li::before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.role-points li:first-child::before{top:10px}

/* Experience */
.jobs{display:grid;gap:0;border-top:2px solid var(--ink)}
.job{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(20px,4vw,56px);padding-block:36px;border-bottom:1px solid var(--line)}
.job-meta{display:grid;gap:6px;align-content:start}
.job-meta .org{font-family:var(--f-display);font-size:1.5rem}
.job-meta .label{color:var(--accent-2)}
.job-body{display:grid;gap:16px;min-width:0}
.job-body h3{font-size:clamp(1.4rem,2.6vw,1.9rem);color:var(--accent)}
.job-body .sum{color:var(--ink-soft)}
.job-points{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.job-points li{padding-left:18px;border-left:3px solid var(--butter)}
.job-points b{font-weight:700}

/* Fast learner */
.fast-sec{background:var(--p4);color:var(--p4-fg)}
.fast-sec .sec-head p{color:var(--p4-fg);opacity:.85}
.fast-sec .sec-head .label{color:var(--p3)}
.fast-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,64px)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.timeline li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;padding-block:16px;border-top:1px solid color-mix(in srgb, var(--p4-fg) 22%, transparent)}
.timeline .when{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--p3);padding-top:3px}
.learned{background:var(--p3);color:var(--p3-fg);border-radius:20px;padding:28px;display:grid;gap:14px;align-content:start}
.learned h3{font-size:1.6rem}
.learned ul{margin:0;padding-left:20px;display:grid;gap:8px}

/* Skills + education */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.chips li{padding:8px 16px;border-radius:999px;border:1.5px solid var(--ink);font-weight:500;font-size:.96rem}
.chips li:nth-child(4n+1){background:var(--p1);color:var(--p1-fg);border-color:var(--p1)}
.chips li:nth-child(4n+3){background:var(--p3);color:var(--p3-fg);border-color:var(--p3)}
.sub{font-family:var(--f-display);font-size:1.5rem;margin-bottom:18px}
.langs{margin-top:28px}
.edu{display:grid;gap:0;border-top:2px solid var(--ink)}
.edu-item{display:grid;gap:4px;padding-block:18px;border-bottom:1px solid var(--line)}
.edu-item .t{font-family:var(--f-display);font-size:1.3rem}
.edu-item .label{color:var(--accent-2)}
.edu-item .n{color:var(--ink-soft)}

/* Closing */
.closing{background:var(--p1);color:var(--p1-fg);text-align:left}
.closing h2{font-size:clamp(2.2rem,5.6vw,4.2rem);max-width:18ch}
.closing-grid{display:grid;gap:28px}
.closing p{font-size:1.15rem;max-width:56ch;opacity:.92}
.closing .btn{background:var(--butter);color:#2B2236;border-color:var(--butter)}
.closing .btn.ghost{background:transparent;color:var(--p1-fg);border-color:var(--p1-fg)}
footer{background:var(--p1);color:var(--p1-fg)}
footer .wrap{padding-block:18px 28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:.88rem;opacity:.8;border-top:1px solid color-mix(in srgb, var(--p1-fg) 25%, transparent)}

/* Editing */
.editing [data-k],.editing [data-l]{outline:1.5px dashed color-mix(in srgb, currentColor 45%, transparent);outline-offset:4px;border-radius:4px;cursor:text}
.editing [data-k]:focus,.editing [data-l]:focus{outline:2px solid var(--focus)}
.editing .chips li,.editing .band li{min-width:2ch}
.editbar{position:fixed;z-index:20;right:calc(16px + env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;max-width:calc(100vw - 32px);background:var(--navy);color:var(--navy-fg);padding:8px;border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.editbar button{font:600 .88rem var(--f-body);border:0;border-radius:999px;padding:9px 16px;cursor:pointer;background:transparent;color:inherit}
.editbar button.primary{background:var(--butter);color:#2B2236}
.editbar .msg{font-size:.82rem;padding:0 8px;opacity:.85}
.edit-hint{position:fixed;z-index:19;left:calc(16px + env(safe-area-inset-left, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));max-width:min(340px, calc(100vw - 32px));background:var(--butter);color:#2B2236;padding:12px 14px;border-radius:14px;font-size:.88rem;line-height:1.45;box-shadow:0 12px 40px rgba(0,0,0,.2)}

@media (max-width: 860px){
  .hero-grid,.profile-grid,.fast-grid,.two,.job,.role-block{grid-template-columns:minmax(0,1fr)}
  .portrait{max-width:340px}
  .flow{grid-template-columns:minmax(0,1fr);gap:22px}
  .flow::before{left:27px;right:auto;top:0;bottom:0;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--ink) 0 8px,transparent 8px 14px)}
  .stage{grid-template-columns:56px minmax(0,1fr);column-gap:18px;padding-right:0}
  .stage .dot{grid-row:span 3}
  .stage h3{margin-top:2px}
  .edit-hint{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
}
@media (max-width: 480px){
  body{font-size:16px}
  .c-row{grid-template-columns:72px minmax(0,1fr) auto}
  .timeline li{grid-template-columns:minmax(0,1fr);gap:4px}
}
</style>

s business departments and teams."], "with": "Client leadership, business teams, technical teams"}, {"title": "Process improvement and change", "lede": "I have experience working on projects that change how teams operate, and I help people through the change.", "points": ["Using data and AI models to make the process more strategic and customer first.", "We started by stripping the old process back to see what worked, what did not, and what change was realistic.", "Use project management tools and principles to coordinate end-to-end project delivery.", "A big part of it is change management: sitting with the client team and helping them through the difficult parts of the change."], "with": "Client leadership, internal and external teams"}, {"title": "Analysis, strategy and costing", "lede": "I worked across strategy and operations at a fast-growing fintech.", "points": ["Pricing strategy and planning with the Strategic Finance and Core Finance teams.", "Business cases, market research and competitor benchmarking within a product team.", "Costing work: I found gaps in how costs were tracked and found cheaper alternatives.", "At Artefact I also analyse campaign results, reporting, deliver key insights to stakeholders and relevant teams."], "with": "Product, finance, operations and strategy"}, {"title": "Marketing and CRM", "lede": "My current role has given me a solid understanding of how digital and omnichannel marketing works.", "points": ["Brand managers come to me to understand their customers, which channels to use and what past campaigns showed.", "I write and manage campaign briefs, and I have tested using AI to automate parts of the briefing process.", "I coordinate the full process: briefing with the brand team, audience builds with the data team, QA, and execution with the CRM team.", "I understand how customer data is used for personalisation and targeting."], "with": "Brand, data and CRM teams"}], "jobs": [{"title": "Project Manager", "org": "Artefact South Africa", "dates": "DECEMBER 2025 TO PRESENT", "summary": "Placed on Artefact's account with one of South Africa's largest retail groups. I coordinate a mixed team of data analysts, designers, brand, CRM and developers, from both Artefact and the client, to deliver personalised marketing within the client's precision marketing department.", "points": [{"h": "Process and ways of working", "t": "Redesign how the client's team works and help them adopt the new process, from RACI matrices and org structure mapping to workflow documentation in Miro and change management."}, {"h": "Team and delivery management", "t": "Plan and track the work of internal data analysts and engineers in Asana, set priorities, and run analyses from Databricks scripts."}, {"h": "Stakeholder coordination", "t": "Coordinate brand managers, campaign owners, creative, data and CRM teams so that everyone works to the same deadlines and goals."}, {"h": "Personalised marketing", "t": "Advise brand teams on channels, messaging and lessons from past campaigns, and manage campaign briefs through to execution."}, {"h": "AI and automation", "t": "Use Claude and other AI tools every day, and have tested AI to automate parts of the briefing process."}, {"h": "Reporting", "t": "Build production schedules, deadline trackers and status reports, plus weekly, monthly and post-campaign reporting."}]}, {"title": "Junior Operations and Strategy Analyst", "org": "Ozow (Pty) Ltd", "dates": "FEBRUARY 2025 TO NOVEMBER 2025", "summary": "Worked across strategy and operations at one of South Africa's leading fintech companies, supporting growth decisions and helping operations run more efficiently.", "points": [{"h": "Strategic planning", "t": "Supported short-term initiatives and long-term plans with market research, competitor benchmarking and performance analysis."}, {"h": "Business cases and analysis", "t": "Built business cases within a product team and analysed financial and performance data."}, {"h": "Cost optimisation", "t": "Worked out unit economics and internal cost structures, found gaps in costing and identified cheaper alternatives."}, {"h": "Pricing and finance", "t": "Worked with the Strategic Finance and Core Finance teams on pricing strategy, vendor and bank billing checks, and financial analysis."}, {"h": "Cross-team work", "t": "Worked with product, finance, marketing and operations teams every day, which gave me exposure to almost every part of the business."}]}], "skills": ["Project management", "Stakeholder management", "Process improvement", "Change management", "Business cases", "Pricing and cost analysis", "Reporting", "Asana", "Miro and Lucidchart", "Databricks", "Claude and AI tools", "AI automation", "CRM coordination", "Campaign briefing and management", "Personalised marketing", "Consumer behaviour", "Microsoft and Google suites"], "languages": ["English (fluent)", "Afrikaans (fluent)"], "education": [{"title": "BCom International Business Studies", "place": "Stellenbosch University", "dates": "2021 TO 2024", "note": "Majoring in Finance, Economics and Strategic Management"}, {"title": "Exchange Student", "place": "Maastricht University, the Netherlands", "dates": "2024 TO 2025", "note": "Erasmus Student Network, Partnership Committee"}], "closing": "", "cvName": "Morgan_Botha_CV.pdf", "photo": "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wgARCAMgAoADASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECAwQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfpQFgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAhgAACaGgGmhiYhgmAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgYgAAAGIBoBoGgGJgIGAAIYAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACaGACAAAAAAAAAAAAAAAAAAAAAAAABoGIGAAAAAAAAAAAAAAAAA <script id="app-js">
(function(){
  var stateEl = document.getElementById('state');
  var S = JSON.parse(stateEl.textContent);
  var app = document.getElementById('app');
  var editing = false, ART = null, DL = null;

  // Capture the static shell now, so a save can rebuild the whole page from state.
  var shellParts = [];
  Array.prototype.forEach.call(document.body.children, function(el){
    if (/^(TITLE|META|LINK|STYLE)$/.test(el.tagName)) shellParts.push(el.outerHTML);
  });
  var appScript = document.getElementById('app-js').outerHTML;
  var resetCss = (document.head.querySelector('style') || {}).textContent || '';

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function k(p){ return ' data-k="' + p + '"'; }
  function l(p){ return ' data-l="' + p + '"'; }
  function lis(arr){ return arr.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join(''); }

  function render(){
    var h = '';
    h += '<header class="hero"><div class="wrap hero-grid">';
    h += '<div class="portrait"><div class="arch"><img id="photo" alt="Portrait of ' + esc(S.name) + '" src="data:image/jpeg;base64,' + S.photo + '"></div>';
    h += '</div>';
    h += '<div class="hero-copy">';
    h += '<span class="label">Portfolio</span>';
    h += '<h1 class="name"' + k('name') + '>' + esc(S.name) + '</h1>';
    h += '<p class="role"' + k('role') + '>' + esc(S.role) + '</p>';
    h += '<p class="intro"' + k('intro') + '>' + esc(S.intro) + '</p>';
    h += '<div class="contact">';
    h += crow('Email', 'email') + crow('Phone', 'phone') + crow('LinkedIn', 'linkedin') + crow('Time zone', 'tz', true);
    h += '</div>';
    h += '<div class="cta">';
    h += '<a class="btn" href="mailto:' + esc(S.email) + '">Email me</a>';
    h += '<a class="btn ghost" href="' + esc(S.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>';
    h += '<a class="btn ghost" href="Morgan_Botha_CV.pdf" download>Download CV</a>';
    h += '</div></div></div></header>';

    h += '<div class="band"><div class="wrap"><span class="band-label">Range</span><ul' + l('range') + '>' + lis(S.range) + '</ul></div></div>';

    h += '<section><div class="wrap profile-grid">';
    h += '<div style="display:grid;gap:20px"><span class="label" style="color:var(--accent)"' + k('profileTitle') + '>' + esc(S.profileTitle) + '</span>';
    h += '<p class="profile-text"' + k('profile') + '>' + esc(S.profile) + '</p></div>';
    h += '<div class="facts">' + S.facts.map(function(f,i){ return '<div class="fact"><span class="label"' + k('facts.'+i+'.k') + '>' + esc(f.k) + '</span><span' + k('facts.'+i+'.v') + '>' + esc(f.v) + '</span></div>'; }).join('') + '</div>';
    h += '</div></section>';

    h += '<section class="flow-sec"><div class="wrap">';
    h += '<div class="sec-head"><span class="label">How I work</span><h2' + k('flowTitle') + '>' + esc(S.flowTitle) + '</h2><p' + k('flowIntro') + '>' + esc(S.flowIntro) + '</p></div>';
    h += '<ol class="flow">' + S.stages.map(function(s,i){
      return '<li class="stage"><span class="dot" aria-hidden="true">' + (i+1) + '</span><h3' + k('stages.'+i+'.step') + '>' + esc(s.step) + '</h3><span class="with"' + k('stages.'+i+'.with') + '>' + esc(s.with) + '</span><p' + k('stages.'+i+'.text') + '>' + esc(s.text) + '</p></li>';
    }).join('') + '</ol>';
    h += '</div></section>';

    h += '<section><div class="wrap">';
    h += '<div class="sec-head"><span class="label">More than one skill set</span><h2' + k('rolesTitle') + '>' + esc(S.rolesTitle) + '</h2><p' + k('rolesIntro') + '>' + esc(S.rolesIntro) + '</p></div>';
    h += '<div class="roles">' + S.roles.map(function(r,i){
      return '<article class="role-block"><div class="role-head"><h3' + k('roles.'+i+'.title') + '>' + esc(r.title) + '</h3><p class="lede"' + k('roles.'+i+'.lede') + '>' + esc(r.lede) + '</p><div style="display:grid;gap:4px;margin-top:6px"><span class="label">Who I work with</span><span class="wwith"' + k('roles.'+i+'.with') + '>' + esc(r.with) + '</span></div></div><ul class="role-points"' + l('roles.'+i+'.points') + '>' + lis(r.points) + '</ul></article>';
    }).join('') + '</div>';
    h += '</div></section>';

    h += '<section style="padding-top:0"><div class="wrap">';
    h += '<div class="sec-head"><span class="label">Experience</span><h2>Where I have worked</h2></div>';
    h += '<div class="jobs">' + S.jobs.map(function(j,i){
      return '<article class="job"><div class="job-meta"><span class="org"' + k('jobs.'+i+'.org') + '>' + esc(j.org) + '</span><span class="label"' + k('jobs.'+i+'.dates') + '>' + esc(j.dates) + '</span></div>'
        + '<div class="job-body"><h3' + k('jobs.'+i+'.title') + '>' + esc(j.title) + '</h3><p class="sum"' + k('jobs.'+i+'.summary') + '>' + esc(j.summary) + '</p><ul class="job-points">'
        + j.points.map(function(p,n){ return '<li><b' + k('jobs.'+i+'.points.'+n+'.h') + '>' + esc(p.h) + '</b>: <span' + k('jobs.'+i+'.points.'+n+'.t') + '>' + esc(p.t) + '</span></li>'; }).join('')
        + '</ul></div></article>';
    }).join('') + '</div>';
    h += '</div></section>';


    h += '<section><div class="wrap two">';
    h += '<div><h2 class="sub">Skills</h2><ul class="chips"' + l('skills') + '>' + lis(S.skills) + '</ul>';
    h += '<div class="langs"><h2 class="sub">Languages</h2><ul class="chips"' + l('languages') + '>' + lis(S.languages) + '</ul></div></div>';
    h += '<div><h2 class="sub">Education</h2><div class="edu">' + S.education.map(function(e,i){ return '<div class="edu-item"><span class="label"' + k('education.'+i+'.dates') + '>' + esc(e.dates) + '</span><span class="t"' + k('education.'+i+'.title') + '>' + esc(e.title) + '</span><span' + k('education.'+i+'.place') + '>' + esc(e.place) + '</span><span class="n"' + k('education.'+i+'.note') + '>' + esc(e.note) + '</span></div>'; }).join('') + '</div></div>';
    h += '</div></section>';

    h += '<section class="closing"><div class="wrap closing-grid"><span class="label" style="opacity:.75">Get in touch</span><h2>Thank you for taking a look.</h2><p' + k('closing') + '>' + esc(S.closing) + '</p>';
    h += '<div class="cta"><a class="btn" href="mailto:' + esc(S.email) + '">' + esc(S.email) + '</a><a class="btn ghost" href="' + esc(S.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a></div></div></section>';
    h += '<footer><div class="wrap"><span>' + esc(S.name) + ', ' + esc(S.location) + '</span><span>' + esc(S.phone) + '</span></div></footer>';

    app.innerHTML = h;
    wire();
  }

  function crow(label, key, noCopy){
    return '<div class="c-row"><span class="label">' + label + '</span><span class="c-val"' + k(key) + '>' + esc(S[key]) + '</span>'
      + (noCopy ? '<span></span>' : '<button class="copy" type="button" data-copy="' + key + '">Copy</button>') + '</div>';
  }

  function wire(){
    app.querySelectorAll('[data-copy]').forEach(function(b){
      b.addEventListener('click', function(){
        var v = S[b.getAttribute('data-copy')];
        var done = function(){ b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy'; }, 1600); };
        try {
          navigator.clipboard.writeText(v).then(done, function(){ selectText(b.previousElementSibling); });
        } catch(e){ selectText(b.previousElementSibling); }
      });
    });
    var dl = document.getElementById('dl-cv');
    if (DL && S.cv) {
      dl.hidden = false;
      dl.addEventListener('click', function(){
        try {
          var bin = atob(S.cv), arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          DL.save({ filename: S.cvName || 'CV.pdf', data: new Blob([arr]) }).catch(function(){});
        } catch(e){}
      });
    }
  }
  function selectText(el){ var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  // ---------- Editing (only shown to people who can edit this page) ----------
  function setPath(obj, path, val){
    var p = path.split('.'), o = obj;
    for (var i = 0; i < p.length - 1; i++) o = o[/^\d+$/.test(p[i]) ? +p[i] : p[i]];
    var last = p[p.length-1]; o[/^\d+$/.test(last) ? +last : last] = val;
  }
  function enterEdit(){
    editing = true;
    document.documentElement.classList.add('editing');
    app.querySelectorAll('[data-k]').forEach(function(el){
      el.setAttribute('contenteditable', 'plaintext-only');
      if (el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable', 'true');
    });
    app.querySelectorAll('[data-l]').forEach(function(el){ el.setAttribute('contenteditable', 'true'); });
    app.querySelectorAll('a').forEach(function(a){ a.dataset.href = a.getAttribute('href') || ''; a.removeAttribute('href'); });
    drawBar();
  }
  function collect(){
    app.querySelectorAll('[data-k]').forEach(function(el){ setPath(S, el.getAttribute('data-k'), el.innerText.replace(/\s+/g, ' ').trim()); });
    app.querySelectorAll('[data-l]').forEach(function(el){
      var items = Array.prototype.map.call(el.querySelectorAll('li'), function(li){ return li.innerText.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
      setPath(S, el.getAttribute('data-l'), items);
    });
  }
  function buildDoc(){
    var json = JSON.stringify(S).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetCss + '</style></head><body>'
      + shellParts.join('\n') + '\n<main id="app"></main>\n<script id="state" type="application/json">' + json + '<\/script>\n' + appScript + '</body></html>';
  }
  function save(){
    collect();
    setMsg('Saving...');
    ART.publish(buildDoc()).then(function(){ setMsg('Saved'); }, function(e){
      var c = e && e.code;
      setMsg(c === 'conflict' ? 'Someone saved first. The page will reload.' : (c === 'not_writer' || c === 'not_granted') ? 'You do not have edit access.' : 'Could not save. Try again.');
    });
  }
  function cancel(){ editing = false; document.documentElement.classList.remove('editing'); S = JSON.parse(stateEl.textContent); render(); drawBar(); }

  function pickFile(accept, cb){
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept;
    inp.addEventListener('change', function(){ if (inp.files && inp.files[0]) cb(inp.files[0]); });
    inp.click();
  }
  function changePhoto(){
    pickFile('image/*', function(file){
      var fr = new FileReader();
      fr.onload = function(){
        var img = new Image();
        img.onload = function(){
          var tw = 640, th = 800, c = document.createElement('canvas'); c.width = tw; c.height = th;
          var r = Math.max(tw / img.width, th / img.height), w = img.width * r, h = img.height * r;
          c.getContext('2d').drawImage(img, (tw - w) / 2, (th - h) / 2, w, h);
          S.photo = c.toDataURL('image/jpeg', 0.82).split(',')[1];
          document.getElementById('photo').src = 'data:image/jpeg;base64,' + S.photo;
          setMsg('New photo ready. Save to keep it.');
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function replaceCV(){
    pickFile('application/pdf', function(file){
      var fr = new FileReader();
      fr.onload = function(){ S.cv = String(fr.result).split(',')[1]; S.cvName = file.name; setMsg('New CV ready. Save to keep it.'); };
      fr.readAsDataURL(file);
    });
  }

  var bar = null, hint = null;
  function setMsg(t){ var m = bar && bar.querySelector('.msg'); if (m) m.textContent = t; }
  function drawBar(){
    if (!ART) return;
    if (!bar){ bar = document.createElement('div'); bar.className = 'editbar'; document.body.appendChild(bar); }
    if (editing){
      bar.innerHTML = '<span class="msg">Click any text to edit</span><button type="button" data-a="photo">Change photo</button><button type="button" data-a="cv">Replace CV</button><button type="button" data-a="cancel">Cancel</button><button type="button" class="primary" data-a="save">Save changes</button>';
      if (!hint){ hint = document.createElement('div'); hint.className = 'edit-hint'; hint.textContent = 'In lists, press Enter to add a new item and delete the text of an item to remove it.'; document.body.appendChild(hint); }
    } else {
      bar.innerHTML = '<button type="button" class="primary" data-a="edit">Edit page</button>';
      if (hint){ hint.remove(); hint = null; }
    }
    bar.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var a = b.getAttribute('data-a');
        if (a === 'edit') enterEdit(); else if (a === 'save') save(); else if (a === 'cancel') cancel();
        else if (a === 'photo') changePhoto(); else if (a === 'cv') replaceCV();
      });
    });
  }

  render();

})();
</script></body></html>
</body></html>
